# api.promoter.thevuteam.com — reverse proxy to the FastAPI/uvicorn backend running
# on 127.0.0.1:8000 (managed by the vu-backend systemd service). Certbot will rewrite
# this file to add the SSL server block + HTTP->HTTPS redirect in step 9.

server {
    server_name api.promoter.thevuteam.com;

    # Promoters upload check-in/check-out photos — nginx's default 1m limit would
    # reject those uploads with a 413, so this needs to be raised up front.
    client_max_body_size 25m;

    # Slow/lossy mobile uplinks stalled photo uploads past nginx's 60s default (408).
    client_body_timeout 180s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Image/voice uploads over a slow mobile connection can take a while.
        proxy_connect_timeout 75s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/promoter.thevuteam.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/promoter.thevuteam.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = api.promoter.thevuteam.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name api.promoter.thevuteam.com;
    return 404; # managed by Certbot


}