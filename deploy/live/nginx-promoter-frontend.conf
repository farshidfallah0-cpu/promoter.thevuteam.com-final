# promoter.thevuteam.com — static React (Vite) build, served directly by nginx.
# Certbot will rewrite this file to add the SSL server block + HTTP->HTTPS redirect
# when you run `certbot --nginx` in step 9 of DEPLOY.md — you don't add that by hand.

server {
    server_name promoter.thevuteam.com;

    root /var/www/promoter/frontend;
    index index.html;

    # React Router (client-side routing) — any unknown path falls back to index.html
    # instead of nginx 404ing it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed static assets (Vite fingerprints filenames on build, so this
    # is always safe — a new deploy gets new filenames, never a stale cache hit).
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # PWA files must never be cached, or updates won't reach installed devices.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest-admin.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/promoter.thevuteam.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/promoter.thevuteam.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = promoter.thevuteam.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name promoter.thevuteam.com;
    return 404; # managed by Certbot


}