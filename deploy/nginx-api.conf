# api.promoter.thevuteam.com — reverse proxy to the FastAPI/uvicorn backend running
# on 127.0.0.1:8000 (managed by the vu-backend systemd service). Certbot will rewrite
# this file to add the SSL server block + HTTP->HTTPS redirect in step 9.

server {
    listen 80;
    listen [::]:80;
    server_name api.promoter.thevuteam.com;

    # Promoters upload check-in/check-out photos — nginx's default 1m limit would
    # reject those uploads with a 413, so this needs to be raised up front.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Image/voice uploads over a slow mobile connection can take a while.
        proxy_connect_timeout 75s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
